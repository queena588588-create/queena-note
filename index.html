<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>👑✨ 塞爆購物車｜專屬系統</title>

<meta property="og:title"
      content="👑✨ 塞爆購物車｜專屬系統 🛒">

<meta property="og:description"
      content="想要的・這裡都點得到 🛒｜我要買・想了解｜每檔期優惠不同💡我會盡快回覆唷">

<meta property="og:type"
      content="website">

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:linear-gradient(180deg,#fff8df,#fff0ba);
  color:#4b3517;
}

.card{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:30px 22px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.brand{
  font-size:13px;
  letter-spacing:2px;
  color:#a98742;
  margin-bottom:12px;
}

h1{
  font-size:23px;
  line-height:1.45;
  margin:0 0 25px;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.buy{
  background:#f4c84f;
  color:#3f2d0d;
}

.ask{
  background:#fff6d9;
  color:#5b4728;
  border:1px solid #ead28d;
}

#status{
  margin-top:20px;
  font-size:15px;
  line-height:1.7;
  color:#806e55;
}

.done{
  font-size:45px;
  margin-bottom:12px;
}
</style>
</head>

<body>

<div class="card">

  <div class="brand">
    QUEENA SELECT
  </div>

  <div id="main">

    <h1 id="product">
      商品載入中...
    </h1>
<button
  id="buyBtn"
  class="buy"
  onclick="showQuantity()"
  style="display:none;">
  🛒 我要買
</button>

<div id="quantityBox" style="display:none; margin-top:16px;">

  <div style="font-size:16px; margin-bottom:10px;">
    選擇數量
  </div>

  <div style="display:flex; justify-content:center; align-items:center; gap:20px;">

    <button onclick="changeQty(-1)"
      style="width:55px; margin:0;">
      −
    </button>

    <span id="qty"
      style="font-size:24px; font-weight:bold;">
      1
    </span>

    <button onclick="changeQty(1)"
      style="width:55px; margin:0;">
      ＋
    </button>

  </div>

  <button
    class="buy"
    onclick="sendBuy()"
    style="margin-top:15px;">
    確認我要買
  </button>

</div>

    <button
  id="askBtn"
  class="ask"
  onclick="sendInquiry('我想了解')"
  style="display:none;">
  💬 我想了解
</button>

<button
  id="interestBtn"
  class="ask"
  onclick="sendInquiry('我有興趣')"
  style="display:none;">
  🙋 我有興趣
</button>

<button
  id="contactBtn"
  class="ask"
  onclick="sendInquiry('請聯絡我')"
  style="display:none;">
  📩 請聯絡我
</button>

    <div id="status"></div>

  </div>

</div>

<script>

const LIFF_ID =
  '2011084503-x54CcAEe';

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbz3cGUC6hsUJfhKJJ-kCznEaYtwiBKcTPpBO-EK40ZB7q0cp4sHjhUye-zN4p1bcQ8s/exec';

let productName = '';
let profile = null;


// =========================
// 啟動
// =========================
async function start(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );
const buttonParam = params.get('b') || 'buy,ask';

const selectedButtons =
  buttonParam.split(',');

if (selectedButtons.includes('buy')) {
  document.getElementById('buyBtn').style.display = 'block';
}

if (selectedButtons.includes('ask')) {
  document.getElementById('askBtn').style.display = 'block';
}

if (selectedButtons.includes('interest')) {
  document.getElementById('interestBtn').style.display = 'block';
}

if (selectedButtons.includes('contact')) {
  document.getElementById('contactBtn').style.display = 'block';
}
    productName =
      params.get('n') || '';

    // LIFF redirect 備援
    const state =
      params.get('liff.state') || '';

    if(!productName && state){

      const decoded =
        decodeURIComponent(state);

      const q =
        decoded.indexOf('?');

      if(q >= 0){

        const sp =
          new URLSearchParams(
            decoded.substring(q + 1)
          );

        productName =
          sp.get('n') || '';
      }
    }

    if(!productName){

      document.getElementById('product')
        .textContent =
        '找不到商品資料';

      return;
    }

    document.getElementById('product')
      .textContent =
      productName;


    // 初始化 LINE
    await liff.init({
      liffId: LIFF_ID
    });


    if(!liff.isLoggedIn()){

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }


    profile =
      await liff.getProfile();


  }catch(err){

    document.getElementById('status')
      .textContent =
      'LINE 身分確認失敗，請重新開啟。';

  }

}


// =========================
// 客人按按鈕
// =========================
  let buyQty = 1;

function showQuantity() {
  document.getElementById('quantityBox').style.display = 'block';
}

function changeQty(change) {
  buyQty += change;

  if (buyQty < 1) {
    buyQty = 1;
  }

  document.getElementById('qty').textContent = buyQty;
}

function sendBuy() {
  sendInquiry('我要買', buyQty);
}
async function sendInquiry(action, quantity = ''){

  try{

    if(!profile){

      document.getElementById('status')
        .textContent =
        '正在確認 LINE 身分，請稍候再按一次 ♡';

      return;
    }


    document.getElementById('status')
      .textContent =
      '正在送出...';


    const payload =
      new URLSearchParams();

    payload.append(
      'type',
      'noteInquiry'
    );

    payload.append(
      'lineName',
      profile.displayName || ''
    );

    payload.append(
      'lineUserId',
      profile.userId || ''
    );

    payload.append(
      'title',
      productName
    );

    payload.append(
      'action',
      action
    );
payload.append(
  'quantity',
  quantity
);

    await fetch(
      GAS_URL,
      {
        method:'POST',
        headers:{
          'Content-Type':
          'application/x-www-form-urlencoded;charset=UTF-8'
        },
        body:
          payload.toString()
      }
    );


    document.getElementById('main').innerHTML =
  '<div class="done">✅</div>' +
  '<h1>已收到</h1>' +
  '<div id="status">' +
    '我已收到你的「' + action + '」♡<br>' +
    '我會盡快回覆你<br><br>' +
    productName +
  '</div>' +

  '<a href="https://line.me/ti/p/aZ1M8UpSkD" target="_blank" ' +
  'style="' +
    'display:block;' +
    'margin-top:22px;' +
    'padding:16px;' +
    'border-radius:15px;' +
    'background:#06c755;' +
    'color:white;' +
    'font-size:18px;' +
    'font-weight:bold;' +
    'text-decoration:none;' +
  '">' +
    '💚 加 Queena LINE，方便直接聯絡' +
  '</a>';

      '<div class="done">✅</div>' +

      '<h1>已收到</h1>' +

      '<div id="status">' +
      'Queena 已收到你的「' +
      action +
      '」♡<br><br>' +
      productName +
      '</div>';


  }catch(err){

    document.getElementById('status')
      .textContent =
      '送出失敗，請再試一次。';

  }

}


start();

</script>

</body>
</html>
